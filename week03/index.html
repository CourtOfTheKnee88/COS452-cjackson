<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Week 3 Starter -- Hello Triangle</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="gl-canvas"></canvas>
    <script>
      const canvas = document.getElementById("gl-canvas");
      const gl = canvas.getContext("webgl2");
      if (!gl) {
        throw new Error("WebGL2 is not available on this device/browser.");
      }

      const vertexSource = `#version 300 es
      in vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }`;

      const fragmentSource = `#version 300 es
      precision mediump float;
      out vec4 outColor;
      void main() {
        outColor = vec4(0.5, 0.1, 0.9, 1.0);  // TODO(student): recolor me
      }`;

      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error("Shader failed to compile: " + log);
        }
        return shader;
      }

      function createProgram(gl, vsSource, fsSource) {
        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(
          program,
          createShader(gl, gl.FRAGMENT_SHADER, fsSource),
        );
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(
            "Program failed to link: " + gl.getProgramInfoLog(program),
          );
        }
        return program;
      }

      const program = createProgram(gl, vertexSource, fragmentSource);

      // TODO(student): change these three vertices
      const positions = new Float32Array([
        -0.0,
        0.0, // top
        0.5,
        0.5, // bottom-left
        -0.5,
        1.1, // bottom-right
      ]);

      // Clipping the triangle to is done automatically so that the tringle is always visible on the screen.
      // You can always extend the triangle outside of the screen and it will be clipped to fit the screen.
      // The triangle will just be partially drawn outside of the screen and not visible to the user.

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      const aPosition = gl.getAttribLocation(program, "a_position");
      gl.enableVertexAttribArray(aPosition);
      gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

      function render() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);

        gl.useProgram(program);
        gl.clearColor(0.1, 0.12, 0.16, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      window.addEventListener("resize", render);
      render();
    </script>
  </body>
</html>
