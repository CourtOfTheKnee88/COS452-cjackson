<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Week 1 Starter — Canvas &amp; Clear Color</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="gl-canvas"></canvas>
    <script>
      const canvas = document.getElementById("gl-canvas");
      const gl = canvas.getContext("webgl2");

      if (!gl) {
        throw new Error("WebGL2 is not available on this device/browser.");
      }

      function resizeCanvasToDisplaySize() {
        const dpr = window.devicePixelRatio || 1;
        const width = Math.round(canvas.clientWidth * dpr);
        const height = Math.round(canvas.clientHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      // Used https://www.w3schools.com/jsref/met_win_requestanimationframe.asp to help understand aspects of
      // requestAnimationFrame
      function rgba(r, g, b, a) {
        return [r, g, b, a];
      }

      function diffInRGB(firstColor, secondColor) {
        const diffInR = (secondColor[0] - firstColor[0]) / 100;
        const diffInG = (secondColor[1] - firstColor[1]) / 100;
        const diffInB = (secondColor[2] - firstColor[2]) / 100;
        return [diffInR, diffInG, diffInB];
      }

      let color1 = rgba(0.1, 0.15, 0.35, 1.0);
      let color2 = rgba(0.15, 0.35, 0.1, 1.0);
      let color3 = rgba(0.35, 0.1, 0.15, 1.0);
      const rgbDiff1 = diffInRGB(color1, color2);
      const rgbDiff2 = diffInRGB(color2, color3);
      const rgbDiff3 = diffInRGB(color3, color1);

      count = 0;

      function render() {
        resizeCanvasToDisplaySize();
        gl.viewport(0, 0, canvas.width, canvas.height);

        let r = color1[0];
        let g = color1[1];
        let b = color1[2];

        if (count <= 100) {
          r = color1[0] += rgbDiff1[0];
          g = color1[1] += rgbDiff1[1];
          b = color1[2] += rgbDiff1[2];
        } else if (count <= 200) {
          r = color2[0] += rgbDiff2[0];
          g = color2[1] += rgbDiff2[1];
          b = color2[2] += rgbDiff2[2];
        } else if (count <= 300) {
          r = color3[0] += rgbDiff3[0];
          g = color3[1] += rgbDiff3[1];
          b = color3[2] += rgbDiff3[2];
        } else if (count <= 400) {
          count = 0;
          color1 = rgba(0.1, 0.15, 0.35, 1.0);
          color2 = rgba(0.15, 0.35, 0.1, 1.0);
          color3 = rgba(0.35, 0.1, 0.15, 1.0);
        }
        count++;

        gl.clearColor(r, g, b, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        console.log("Current RGB:", gl.getParameter(gl.COLOR_CLEAR_VALUE));

        requestAnimationFrame(render);
      }

      window.addEventListener("resize", render);
      render();
    </script>
  </body>
</html>
